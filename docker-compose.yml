services:
  # ==========================================
  # Servizo da aplicación Next.js
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appcole
    restart: unless-stopped
    ports:
      # Permite acceder tamén directamente pola rede local (ex: http://192.168.1.50:3000)
      - "3000:3000"
    volumes:
      # Persistencia da base de datos SQLite (appcole.db) e copias de seguridade automáticas
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - RUSTFS_ENDPOINT=http://rustfs:9000
      - RUSTFS_BUCKET=facturas
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-appcoleadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-appcoleadminsecret123}
    depends_on:
      - rustfs
    networks:
      - appcole-net

  # ==========================================
  # Servizo de Almacenamento de Facturas (RustFS)
  # ==========================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: appcole-rustfs
    restart: unless-stopped
    ports:
      # Consola web de administración de RustFS (acceso local http://IP:9001)
      - "9001:9001"
    volumes:
      # Persistencia das facturas e obxectos almacenados en RustFS
      - ./data/rustfs:/data
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-appcoleadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-appcoleadminsecret123}
    networks:
      - appcole-net

  # ==========================================
  # Servizo de Cloudflare Tunnel (cloudflared)
  # ==========================================
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: appcole-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Pega o teu token no arquivo .env (TUNNEL_TOKEN=eyJh...)
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - appcole-net

networks:
  appcole-net:
    driver: bridge
